services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stockwatch
      POSTGRES_PASSWORD: stockwatch
      POSTGRES_DB: stockwatch
    ports:
      # Override if 5432 is already taken on this machine:
      #   POSTGRES_PORT=5433 docker compose up -d
      # Then use that port in every DATABASE_URL below.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
